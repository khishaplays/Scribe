[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scribe-cli"
version = "0.1.0"
description = "A polished CLI for documenting development work."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "sqlalchemy>=2.0",
]

[project.scripts]
scribe = "scribe.cli:app"

[tool.setuptools.packages.find]
include = ["scribe*"]